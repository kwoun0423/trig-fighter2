const questionOrder={};
function nextQuestionObject(){
 const lvl=stageLevel(stage), pool=QUESTION_BANK.filter(x=>x.stage===stage);
 if(!questionOrder[stage]||questionOrder[stage].length===0){questionOrder[stage]=pool.map((_,i)=>i); for(let i=questionOrder[stage].length-1;i>0;i--){let j=Math.random()*(i+1)|0;[questionOrder[stage][i],questionOrder[stage][j]]=[questionOrder[stage][j],questionOrder[stage][i]]}}
 let item=pool[questionOrder[stage].pop()];let options=[item.a,...item.o];for(let i=options.length-1;i>0;i--){let j=Math.random()*(i+1)|0;[options[i],options[j]]=[options[j],options[i]]}
 return {...item,options,correct:options.indexOf(item.a),lvl};
}
function newQ(){q=nextQuestionObject();qCount++;questionID++;$('#qlevel').textContent=`◉ LEVEL ${q.lvl+1} · ${bands[q.lvl]}`;$('#questionNum').textContent=`문제 ${qCount}`;$('#qtext').textContent=q.p;const ans=$('#answers');ans.innerHTML='';const thisQuestion=questionID;q.options.forEach((v,i)=>{const btn=document.createElement('button');btn.className='ans';btn.type='button';btn.textContent=`${'①②③④'[i]}  ${v}`;
// Handle the second finger immediately on touchstart rather than waiting for a synthetic click.
// preventDefault suppresses the synthetic click, avoiding two answers for one tap.
let lastTouch=0;
btn.addEventListener('touchstart',e=>{if(e.cancelable)e.preventDefault();e.stopPropagation();lastTouch=Date.now();choose(i,thisQuestion)},{passive:false});
btn.addEventListener('click',e=>{if(Date.now()-lastTouch<850){e.preventDefault();return}choose(i,thisQuestion)});

}
// Boss designs evolve with each stage; player collision box is unaffected.
const BOSS_PALETTES=[
 ['#61407a','#ff94d2','#fce3f7'],['#2d578c','#6bf0ff','#e3feff'],
 ['#6b3c84','#d78bff','#fff1ff'],['#7b3b66','#ff8994','#fff0c9'],
 ['#2b6873','#4cf3c6','#f3fff4'],['#6f4a7d','#feae5b','#fff0d4'],
 ['#60436e','#e096ff','#e6eeff'],['#374e8e','#78c9ff','#f9fcff'],
 ['#6e304e','#ff5578','#fff3db'],['#302d64','#ffcf64','#f4fcff']
];
function drawEvolvingBoss(){
 const s=stage,t=elapsed,lv=Math.ceil(s/2),colors=BOSS_PALETTES[s-1];
 const [hull,glow,light]=colors,ang=Math.sin(t*1.8)*.035;
 const orb=(x,y,r,fill)=>{ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill()};
 const wing=(side,length,tip)=>{
  ctx.save();ctx.scale(side,1);
  polygon([[10,-11],[length*.58,-24],[length,-tip],[length*.84,13],[19,18],[13,8]],hull,glow,2);
  polygon([[20,-8],[length*.69,-16],[length*.88,-tip+4],[length*.69,8],[20,7]],glow,null);
  ctx.restore();
 };
 ctx.save();ctx.translate(boss.x,boss.y);ctx.rotate(ang);
 ctx.shadowColor=rageTime>0?'#ff304f':glow;ctx.shadowBlur=rageTime>0?29:12;
 // Stage-based silhouettes: scout, armored fighter, sentinel, winged titan, final warship.
 const length=29+lv*3.4;
 if(s>=9){
  polygon([[-35,-26],[-48,-35],[-55,-8],[-42,26],[-23,18],[0,31],[23,18],[42,26],[55,-8],[48,-35],[35,-26]],'#251e48',glow,2.6);
 }
 wing(-1,length,6+lv*2);wing(1,length,6+lv*2);
 if(s>=3){
  for(const sign of [-1,1]){
   ctx.save();ctx.scale(sign,1);
   polygon([[22,-13],[36,-22],[42,-16],[34,0],[25,4]],'#243c5b',glow,1.5);
   orb(34,-17,3.2,light);ctx.restore();
  }
 }
 if(s>=5){
  for(const sign of [-1,1]){
   ctx.save();ctx.scale(sign,1);
   polygon([[8,-21],[13,-35],[21,-40],[22,-21],[18,-10]],hull,glow,1.6);
   orb(19,-34,3,glow);ctx.restore();
  }
 }
 if(s>=7){
  ctx.save();ctx.globalAlpha=.65;ctx.strokeStyle=glow;ctx.lineWidth=2.8;
  ctx.beginPath();ctx.ellipse(0,-2,38+lv*2.5,24+lv,Math.sin(t)*.08,Math.PI*.08,Math.PI*1.92);ctx.stroke();ctx.restore();
 }
 // Main cockpit with heavier plating on later levels.
 polygon([[-16,-24],[0,-31-lv],[16,-24],[23,2],[0,22],[ -23,2]],hull,glow,2.5);
 polygon([[-11,-15],[0,-22-lv],[11,-15],[14,-1],[0,12],[-14,-1]],'#172842',light,1.5);
 const pulse=1+Math.sin(t*5)*.12;
 ctx.shadowBlur=15;orb(0,-5,7.5*pulse,glow);orb(0,-5,3.7,light);
 if(s>=4){
  orb(-16,9,3.2,light);orb(16,9,3.2,light);
 }
 if(s>=6){
  polygon([[-5,10],[0,25],[5,10]],glow,light,1);
  for(const sign of [-1,1]){
   ctx.save();ctx.scale(sign,1);polygon([[26,4],[35,15],[30,24],[21,12]],hull,glow,1.5);ctx.restore();
  }
 }
 if(s>=8){
  for(let k=0;k<4;k++){
   const a=t*.8+k*Math.PI/2;orb(Math.cos(a)*33,Math.sin(a)*19,2.4,k%2?light:glow);
  }
 }
 if(s===10){
  // Final boss receives a rotating, segmented crown and twin glowing cannons.
  for(let k=0;k<6;k++){
   const a=k*Math.PI/3+t*.35;
   ctx.save();ctx.rotate(a);polygon([[-4,-33],[0,-42],[4,-33],[0,-28]],'#faad63',light,1);ctx.restore();
  }
  for(const sign of [-1,1]){ctx.save();ctx.scale(sign,1);orb(39,8,5,glow);orb(39,8,2,light);ctx.restore()}
 }
 if(rageTime>0){ctx.globalAlpha=.32+.16*Math.sin(t*13);ctx.strokeStyle='#ff304f';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,30+lv*3,0,Math.PI*2);ctx.stroke();}
 ctx.restore();
}
function render(){ctx.clearRect(0,0,W,H);ctx.save();if(shake)ctx.translate(rnd(-shake,shake),rnd(-shake,shake));let grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#112349');grad.addColorStop(1,'#071028');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);ctx.strokeStyle='#3d6bb01a';ctx.lineWidth=1;for(let x=0;x<W;x+=38){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=(elapsed*34)%38;y<H;y+=38){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(let s of stars){ctx.fillStyle=`rgba(167,221,255,${.2+s.z*.25})`;ctx.fillRect(s.x,s.y,s.z,s.z*2)}

if(boss)drawEvolvingBoss();
for(let h of hazards){let warning=h.t<h.warn;ctx.save();ctx.fillStyle=warning?'rgba(255,42,74,.12)':'rgba(255,32,59,.42)';ctx.fillRect(h.x-h.width,0,h.width*2,H);ctx.strokeStyle=warning?'#ff526b':'#fff0f0';ctx.lineWidth=warning?1.5:3;ctx.setLineDash(warning?[7,6]:[]);ctx.beginPath();ctx.moveTo(h.x,0);ctx.lineTo(h.x,H);ctx.stroke();ctx.setLineDash([]);if(!warning){ctx.shadowColor='#ff334b';ctx.shadowBlur=21;ctx.fillStyle='#fff6dd';ctx.fillRect(h.x-3,0,6,H)}ctx.restore()}
for(let b of bullets){ctx.save();ctx.shadowColor=b.color;ctx.shadowBlur=12;ctx.fillStyle=b.color;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff9';ctx.beginPath();ctx.arc(b.x-b.r*.2,b.y-b.r*.2,b.r*.34,0,Math.PI*2);ctx.fill();ctx.restore()}
if(player){ctx.save();ctx.translate(player.x,player.y);if(invuln>0&&Math.sin(elapsed*25)>0)ctx.globalAlpha=.47;creatureShape(progress.skinActive);ctx.restore()}
if(laserT>0&&state==='playing'&&player){let bw=5+progress.up.laser*3;let g=ctx.createLinearGradient(player.x-bw*3,0,player.x+bw*3,0);g.addColorStop(0,'#28f1ff00');g.addColorStop(.45,'#66deffb8');g.addColorStop(.5,'#efffff');g.addColorStop(.55,'#66deffb8');g.addColorStop(1,'#28f1ff00');ctx.fillStyle=g;ctx.fillRect(player.x-bw*3,0,bw*6,Math.max(0,player.y-15));ctx.fillStyle='#dcffff';ctx.fillRect(player.x-bw*.45,0,bw*.9,Math.max(0,player.y-15))}
for(let p of particles){ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.r,p.r)}ctx.globalAlpha=1;if(burst>0){ctx.fillStyle=`rgba(191,103,255,${burst*.27})`;ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(W*.5,H*.45);ctx.rotate(elapsed*3);ctx.strokeStyle=`rgba(245,226,255,${burst*.8})`;ctx.lineWidth=8;ctx.beginPath();ctx.arc(0,0,(1.05-burst)*Math.max(W,H),0,Math.PI*2);ctx.stroke();ctx.restore()}
ctx.restore()}
function loop(ts){if(!last)last=ts;let dt=Math.min(.033,(ts-last)/1000);last=ts;if(state==='playing')step(dt);render();raf=requestAnimationFrame(loop)}
window.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')$('#pause').click()});menu();raf=requestAnimationFrame(loop);
